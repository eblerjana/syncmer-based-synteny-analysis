# paths to executables
syncmer_toolkit: "/path/to/syncmer-toolkit"
syncmer_scripts: "/path/to/syncmer-toolkit/scripts"
syng: "/path/to/syng-main"

# name of the output folder
results: "results"

# sample sheet. TSV files with format: <sample> <path/to/assembly.fasta> <contig index> <interval> <contig length> <contig name>
# sample: sample name
# assembly: path to assembly FASTA file
# contig index: index of the contig to be analyzed, i.e. enumerating all contigs in the FASTA file starting from 1, which one shall be considered
# interval: <start>-<end> range of the genomic interval to be considered
# contig length: total length of the contig
# contig name: name of the contig to be analyzed
sample_sheet: "/path/to/sample-sheet.tsv"

# define pairwise alignments to be produced
alignments:
     align1:
        - sample1
        - sample2
     align2:
        - sample2
        - sample3


# parameters for syng, currently set to default parameters.
window_len: 63
kmer_len: 8 
